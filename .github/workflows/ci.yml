name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "UnitTests" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Compilar proyecto y ejecutar pruebas unitarias en JS
  # ─────────────────────────────────────────────
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Backend Dependencies
      run: |
        cd Back-End
        npm install

    - name: Install and Build Frontend
      run: |
        cd Front-End
        npm install
        npm run build

    - name: Install Test Dependencies
      run: |
        cd Tests
        npm install

    - name: Run Unit Tests by Components (JS)
      run: |
        cd Tests
        npm test

  # ─────────────────────────────────────────────
  # JOB 2: Levantar servicios y validar suite de pruebas
  # ─────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create dummy .env for CI
      run: |
        cat > Back-End/.env << 'EOF'
        PORT=3000
        JWT_SECRET=dummy_secret_for_ci
        MONGODB_URI=mongodb://mongodb:27017/dentalone_test
        MONGO_URI=mongodb://mongodb:27017/dentalone_test
        FRONTEND_URL=http://localhost:4200
        MP_ACCESS_TOKEN=dummy_mp_token
        EOF

    - name: Start services with Docker Compose
      run: |
        cd docker
        docker compose up -d --build
      env:
        COMPOSE_DOCKER_CLI_BUILD: 1
        DOCKER_BUILDKIT: 1

    - name: Wait for backend to be ready
      run: |
        echo "Esperando que el backend esté listo en :3000..."
        for i in $(seq 1 30); do
          if curl -s http://localhost:3000/mercado-pago > /dev/null 2>&1; then
            echo "Backend listo después de ${i}s"
            break
          fi
          echo "Intento $i/30 — esperando 3s..."
          sleep 3
        done

    - name: Install and Run JS Tests
      run: |
        cd Tests
        npm install
        npm test

    - name: Show backend logs if tests fail
      if: failure()
      run: docker logs dental_one_backend --tail 50
